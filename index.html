<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>心理学検定 一問一答クイズ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <h1>心理学検定 暗記メーカー</h1>
    <div class="mode-selector">
        <button class="mode-btn active" onclick="changeMode('nameToConcept')">人名 → 固有名詞</button>
        <button class="mode-btn" onclick="changeMode('conceptToName')">固有名詞 → 人名</button>
    </div>

    <div id="progress" style="text-align: right; margin-bottom: 8px;">0 / 0</div>

    <div id="question-box" style="background: #f8fafc; border: 1px solid #e2e8f0; padding: 24px; border-radius: 12px; margin-bottom: 24px;">
        <div id="q-header" style="font-size: 12px; font-weight: bold; color: #64748b; margin-bottom: 8px;">問題</div>
        <div id="q-text" style="font-size: 18px; font-weight: bold; white-space: pre-wrap;">ここに問題が表示されます</div>
    </div>

    <div class="options-grid" id="options-container"></div>
    <div id="feedback-box" style="margin-top: 20px; padding: 16px; border-radius: 8px; display: none; line-height: 1.6;"></div>

    <button id="next-button" onclick="nextQuestion()" style="display: none; width: 100%; padding: 14px; background: #4f46e5; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 20px;">次の問題へ</button>
</div>

<script src="script.js"></script>
</body>
</html>
